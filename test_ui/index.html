<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LMS API Test UI</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 20px auto; padding: 0 12px; }
    h1 { font-size: 1.2rem; }
    h2 { font-size: 1rem; margin-top: 20px; border-bottom: 1px solid #ccc; }
    label { display: inline-block; width: 100px; }
    input, select, button { margin: 4px 0; }
    button { margin-right: 6px; margin-bottom: 4px; }
    #output { background: #f4f4f4; border: 1px solid #ccc; padding: 10px; white-space: pre-wrap; font-size: 12px; min-height: 120px; }
    .row { margin-bottom: 8px; }
    .ok { color: green; }
    .err { color: red; }
  </style>
</head>
<body>
  <h1>LMS API Test UI</h1>
  <p>Simple tester for admin / teacher flows. API: <code id="apiBase"></code></p>

  <h2>Login</h2>
  <div class="row">
    <label>Email</label>
    <input id="email" value="admin" size="30">
  </div>
  <div class="row">
    <label>Password</label>
    <input id="password" type="password" value="123456" size="30">
  </div>
  <button onclick="login()">Login</button>
  <button onclick="bootstrap()">Bootstrap admin (first run only)</button>
  <button onclick="me()">GET /auth/me</button>
  <span id="loginStatus"></span>

  <h2>Academic</h2>
  <button onclick="get('/classes')">List classes</button>
  <button onclick="get('/subjects')">List subjects</button>
  <button onclick="get('/academic-years')">List years</button>
  <button onclick="createYear()">Create sample year</button>
  <button onclick="get('/offerings')">List offerings</button>

  <h2>Users</h2>
  <button onclick="get('/students')">List students</button>
  <button onclick="createStaff()">Create sample staff</button>
  <button onclick="createStudent()">Create sample student</button>

  <h2>Batches &amp; enrollments</h2>
  <button onclick="get('/batches')">List batches</button>
  <button onclick="get('/enrollments')">List enrollments</button>

  <h2>Sessions &amp; attendance</h2>
  <button onclick="get('/sessions/today')">Today sessions</button>
  <button onclick="get('/session-templates')">Session templates</button>

  <h2>Output</h2>
  <button onclick="clearOut()">Clear</button>
  <div id="output"></div>

  <script>
    const API = window.location.origin + '/api/v1';
    document.getElementById('apiBase').textContent = API;

    let token = localStorage.getItem('lms_token') || '';

    function log(msg, isErr) {
      const el = document.getElementById('output');
      const line = document.createElement('div');
      line.className = isErr ? 'err' : 'ok';
      line.textContent = typeof msg === 'string' ? msg : JSON.stringify(msg, null, 2);
      el.prepend(line);
    }

    function clearOut() {
      document.getElementById('output').innerHTML = '';
    }

    async function api(method, path, body) {
      const opts = {
        method,
        headers: { 'Content-Type': 'application/json' }
      };
      if (token) opts.headers['Authorization'] = 'Bearer ' + token;
      if (body) opts.body = JSON.stringify(body);

      const res = await fetch(API + path, opts);
      let data;
      const text = await res.text();
      try { data = JSON.parse(text); } catch { data = text; }

      log(method + ' ' + path + ' → ' + res.status);
      log(data, res.status >= 400);
      return { res, data };
    }

    function get(path) { return api('GET', path); }

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { res, data } = await api('POST', '/auth/login', { email, password });
      if (res.ok && data.token) {
        token = data.token;
        localStorage.setItem('lms_token', token);
        document.getElementById('loginStatus').textContent = 'Logged in as ' + data.user.name + ' (' + data.user.role + ')';
        document.getElementById('loginStatus').className = 'ok';
      } else {
        document.getElementById('loginStatus').textContent = 'Login failed';
        document.getElementById('loginStatus').className = 'err';
      }
    }

    async function bootstrap() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { res, data } = await api('POST', '/auth/bootstrap', { email, password, name: 'Admin' });
      if (res.ok && data.token) {
        token = data.token;
        localStorage.setItem('lms_token', token);
        document.getElementById('loginStatus').textContent = 'Bootstrapped & logged in';
        document.getElementById('loginStatus').className = 'ok';
      }
    }

    function me() { return get('/auth/me'); }

    async function createYear() {
      const y = new Date().getFullYear();
      return api('POST', '/academic-years', {
        name: y + '-' + (y + 1),
        start_date: y + '-04-01',
        end_date: (y + 1) + '-03-31',
        is_active: true
      });
    }

    async function createStaff() {
      const n = Date.now();
      return api('POST', '/staff', {
        email: 'teacher' + n + '@test.local',
        password: '123456',
        name: 'Teacher ' + n
      });
    }

    async function createStudent() {
      const n = Date.now();
      return api('POST', '/students', {
        email: 'student' + n + '@test.local',
        password: '123456',
        name: 'Student ' + n
      });
    }

    if (token) {
      document.getElementById('loginStatus').textContent = 'Token loaded from storage — click Login or Me to verify';
    }
  </script>
</body>
</html>
